<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    background: #08080a; color: #fff; overflow: hidden;
  }
  #bg {
    position: fixed; inset: 0; z-index: -2;
    background: url("bg.jpg") center/cover no-repeat;
    filter: brightness(.5) saturate(1.1);
  }
  #bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.25), rgba(0,0,0,.85) 78%);
  }
  .card {
    width: 400px; max-width: calc(100vw - 32px);
    padding: 34px 30px 28px;
    background: rgba(16,16,18,.82);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px; text-align: center;
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 70px rgba(0,0,0,.65);
    animation: in .35s ease;
  }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  .brand {
    font-weight: 800; letter-spacing: .32em; font-size: 13px;
    color: #ff5500; margin-bottom: 22px;
  }
  h1 { font-size: 15px; letter-spacing: .14em; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 13px; line-height: 1.5; color: #9b9ba3; }
  .spinner {
    width: 26px; height: 26px; margin: 22px auto 0;
    border: 2px solid rgba(255,85,0,.25); border-top-color: #ff5500;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  button {
    margin-top: 20px; width: 100%; padding: 12px;
    background: #ff5500; color: #fff; border: 0; border-radius: 10px;
    font-size: 12px; font-weight: 800; letter-spacing: .14em; cursor: pointer;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  .err { color: #ff6b6b; }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 14px;
    border: 2px solid #ff5500; object-fit: cover;
  }
  .tick {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
    display: grid; place-items: center; font-size: 30px;
    background: rgba(35,165,90,.15); border: 1px solid #23a55a; color: #23a55a;
  }
  input {
    width: 100%; margin-top: 16px; padding: 11px 12px; font-size: 12px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 9px; color: #fff; font-family: monospace;
  }
  input:focus { outline: none; border-color: #ff5500; }
  footer {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    font-size: 10px; letter-spacing: .22em; color: rgba(255,255,255,.35);
  }
  [hidden] { display: none !important; }
</style>
